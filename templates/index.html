<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR Document Search</title>
    <meta name="description" content="Search through your images and documents using OCR-based search.">
    <meta name="session-id" content="{{ session_id }}">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header id="app-header">
        <div class="header-content">
            <h1>OCR Document Search</h1>
            <p class="tagline">Upload images, search by text, find instantly.</p>
            <div class="session-badge-container">
                <span class="session-badge" title="Your documents are private to this browser session">
                    <i class="fa-solid fa-user-shield"></i> Private Session
                </span>
                <button id="copy-session-btn" class="session-action-btn" title="Copy shareable link to open this session on other devices or tabs">
                    <i class="fa-solid fa-link"></i> Copy Link
                </button>
                <button id="new-session-btn" class="session-action-btn" title="Start a fresh empty session">
                    <i class="fa-solid fa-arrow-rotate-right"></i> Reset Session
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Upload Zone -->
        <section id="upload-zone">
            <div id="drop-area" class="drop-area">
                <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
                <p>Drag & drop images here or</p>
                <input type="file" id="file-input" multiple accept="image/png, image/jpeg, image/jpg, image/webp" hidden>
                <button id="browse-btn" class="btn primary-btn">Browse Files</button>
            </div>
            
            <div class="thumbnail-strip-container">
                <div class="thumbnail-header">
                    <h3>Your Library <span id="library-count" class="library-count-badge">0</span></h3>
                    <button id="load-sample-btn" class="btn secondary-btn btn-sm" title="Load sample documents into your session">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> Load Sample Docs
                    </button>
                </div>
                <div id="thumbnail-strip" class="thumbnail-strip">
                    <!-- Thumbnails will be injected here -->
                </div>
            </div>
        </section>

        <!-- Search Section -->
        <section id="search-section">
            <div class="search-bar-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="search-input" placeholder="Search for documents, receipts, text..." autocomplete="off">
            </div>
        </section>

        <!-- Results Area -->
        <section id="results-area">
            <!-- Result cards or empty state injected here -->
            <div id="empty-state" class="empty-state">
                <div class="empty-state-icon">
                    <i class="fa-solid fa-magnifying-glass-chart"></i>
                </div>
                <p>Start searching to see results</p>
            </div>
        </section>
    </main>

    <!-- Preview Modal -->
    <div id="preview-modal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-content glass-panel">
            <button class="close-modal-btn"><i class="fa-solid fa-xmark"></i></button>
            <div class="modal-layout">
                <div class="modal-image-col">
                    <img id="modal-image" src="" alt="Full size preview">
                </div>
                <div class="modal-text-col">
                    <h3>Extracted Text</h3>
                    <div id="modal-ocr-text" class="ocr-text-content">
                        <!-- OCR Text injected here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/js/app.js" defer></script>
</body>
</html>
