<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos — Document Search Prototype</title>
    <meta name="description" content="Search your photos and documents by what you remember — names, amounts, dates, merchants.">
    <meta name="session-id" content="{{ session_id }}">

    <!-- Google Fonts: Google Sans Text (Product Sans-like) + Inter fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Material Symbols (Rounded) — lightweight icon set matching Google product style -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">

    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <!-- ─── Top Navigation Bar ─── -->
    <header id="app-header">
        <div class="header-inner">
            <div class="header-left">
                <span class="material-symbols-rounded header-logo-icon">photo_library</span>
                <h1>Photos</h1>
                <span class="prototype-badge">Prototype</span>
            </div>
            <div class="header-right">
                <div class="session-controls">

                    <div class="session-menu-wrapper">
                        <button id="session-menu-toggle" class="header-icon-btn" title="Session options" aria-label="Session options" aria-expanded="false">
                            <span class="material-symbols-rounded">more_vert</span>
                        </button>
                        <div id="session-menu-dropdown" class="session-dropdown hidden">
                            <button id="copy-session-btn" class="session-dropdown-item">
                                <span class="material-symbols-rounded">link</span>
                                Copy shareable link
                            </button>
                            <button id="new-session-btn" class="session-dropdown-item">
                                <span class="material-symbols-rounded">restart_alt</span>
                                Start new session
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container">

        <!-- ─── Search Section (Primary Interaction) ─── -->
        <section id="search-section">
            <div class="search-bar-wrapper">
                <span class="material-symbols-rounded search-icon">search</span>
                <input type="text" id="search-input"
                       placeholder="Search your photos"
                       autocomplete="off"
                       aria-label="Search your photos by content">
                <button id="search-clear-btn" class="search-clear hidden" aria-label="Clear search">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>
            <div class="suggestion-chips">
                <button type="button" class="chip" data-query="Samrat Mehta">Samrat Mehta</button>
                <button type="button" class="chip" data-query="6500">₹6,500</button>
                <button type="button" class="chip" data-query="Paracetamol">Paracetamol</button>
                <button type="button" class="chip" data-query="Priya Patel">Priya Patel</button>
                <button type="button" class="chip" data-query="Invoice">Invoice</button>
                <button type="button" class="chip" data-query="Aadhaar">Aadhaar card</button>
            </div>
        </section>

        <!-- ─── Results Area (shown after search) ─── -->
        <section id="results-area" class="hidden">
            <!-- Dynamically injected search results or empty state -->
        </section>

        <!-- ─── Upload Zone ─── -->
        <section id="upload-zone">
            <div id="drop-area" class="drop-area">
                <span class="material-symbols-rounded upload-icon">add_photo_alternate</span>
                <p class="drop-title">Add documents</p>
                <p class="drop-subtitle">Drag & drop photos of documents, receipts, or prescriptions</p>
                <input type="file" id="file-input" multiple accept="image/png, image/jpeg, image/jpg, image/webp" hidden>
                <div class="upload-actions">
                    <button id="browse-btn" class="btn-upload">Choose photos</button>
                    <button id="load-sample-btn" class="btn-secondary" title="Load sample documents to try searching">
                        <span class="material-symbols-rounded">auto_awesome</span>
                        Load samples
                    </button>
                </div>
            </div>
        </section>

        <!-- ─── Photo Library Grid ─── -->
        <section id="library-section">
            <div class="library-header">
                <h2>Your photos <span id="library-count" class="count-badge">0</span></h2>
            </div>
            <div id="photo-grid" class="photo-grid">
                <!-- Photo cards injected here -->
            </div>
        </section>

    </main>

    <!-- ─── Preview Modal ─── -->
    <div id="preview-modal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <button class="close-modal-btn" aria-label="Close preview">
                <span class="material-symbols-rounded">close</span>
            </button>
            <div class="modal-layout">
                <div class="modal-image-col">
                    <img id="modal-image" src="" alt="Full size preview">
                </div>
                <div class="modal-text-col">
                    <h3>
                        <span class="material-symbols-rounded" style="font-size:20px;vertical-align:middle;margin-right:6px;">description</span>
                        Extracted text
                    </h3>
                    <div id="modal-ocr-text" class="ocr-text-content">
                        <!-- OCR Text injected here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/js/app.js" defer></script>
</body>
</html>
