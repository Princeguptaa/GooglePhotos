<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search through your uploaded documents using OCR.">
    <title>OCR Document Search</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/app.js" defer></script>
</head>
<body>
    <header id="app-header">
        <h1>OCR Document Search</h1>
        <p class="tagline">Find text in your images instantly</p>
    </header>

    <main>
        <section id="upload-zone" class="glass-card">
            <div id="drop-area">
                <p>Drag & drop images here</p>
                <p>or</p>
                <input type="file" id="file-input" multiple accept=".png,.jpg,.jpeg,.webp" hidden>
                <button id="browse-btn" class="btn">Browse Files</button>
            </div>
            
            <div id="thumbnail-strip" class="hidden">
                <!-- Thumbnails will be injected here -->
            </div>
        </section>

        <section id="search-section">
            <div class="search-container glass-card">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="Search your documents..." aria-label="Search">
            </div>
        </section>

        <section id="results-area">
            <div id="empty-state">
                <div class="empty-icon">📄</div>
                <p id="empty-message">Upload documents and search to see results here.</p>
            </div>
            <div id="results-grid" class="hidden">
                <!-- Result cards will be injected here -->
            </div>
        </section>
    </main>

    <div id="preview-modal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-content glass-card">
            <button id="close-modal" class="close-btn" aria-label="Close modal">&times;</button>
            <div class="modal-body">
                <div class="modal-image-col">
                    <img id="modal-image" src="" alt="Full document preview">
                </div>
                <div class="modal-text-col">
                    <h3>Extracted Text</h3>
                    <div id="modal-ocr-text"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
