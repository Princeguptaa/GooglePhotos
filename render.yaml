services:
  - type: web
    name: ocr-document-search
    runtime: docker
    envVars:
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract
      - key: SECRET_KEY
        generateValue: true
      - key: RENDER
        value: "true"
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
